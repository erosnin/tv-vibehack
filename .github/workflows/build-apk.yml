# Builds the launcher APK in the cloud, so you don't need Java or the Android SDK on your own PC.
# On your fork: Actions tab > Build APK > Run workflow, then download "nocturne-launcher-apk" from the run.
name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'launcher/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Checks launcher/gradle/wrapper/gradle-wrapper.jar against Gradle's published checksums before running it.
      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build debug APK
        working-directory: launcher
        run: |
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew assembleDebug --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: nocturne-launcher-apk
          path: launcher/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
